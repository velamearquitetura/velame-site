backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: 'pt'

collections:
  - name: "configuracoes"
    label: "Configurações Gerais"
    files:
      - label: "Informações do Site"
        name: "info"
        file: "_data/info.json"
        fields:
          - { label: "Telefone / WhatsApp", name: "telefone", widget: "string" }
          - { label: "E-mail", name: "email", widget: "string" }
          - { label: "Instagram (link)", name: "instagram", widget: "string" }
          - { label: "LinkedIn (link)", name: "linkedin", widget: "string" }

  - name: "projetos"
    label: "Projetos"
    folder: "_projetos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome do Projeto", name: "title", widget: "string" }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Residencial", value: "residencial" }
          - { label: "Comercial", value: "comercial" }
          - { label: "Interiores", value: "interiores" }
          - { label: "Obras", value: "obras" }
          - { label: "Para Arquitetos", value: "arquitetos" }
      - { label: "Foto Principal", name: "foto_principal", widget: "image" }
      - { label: "Publicado", name: "publicado", widget: "boolean", default: true }
