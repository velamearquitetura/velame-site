backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: 'pt'

collections:

  # ── CONFIGURAÇÕES GERAIS ──
  - name: "configuracoes"
    label: "Configurações Gerais"
    files:
      - label: "Informações do Site"
        name: "info"
        file: "_data/info.json"
        fields:
          - { label: "Nome do Estúdio", name: "nome", widget: "string", default: "Velame Arquitetura e Construção" }
          - { label: "Telefone / WhatsApp", name: "telefone", widget: "string", default: "(71) 99188-8006" }
          - { label: "E-mail", name: "email", widget: "string", default: "contato@velamearquitetura.com" }
          - { label: "Localização", name: "localizacao", widget: "string", default: "Salvador, Bahia — Brasil" }
          - { label: "Instagram (link)", name: "instagram", widget: "string", default: "https://instagram.com/velamearquitetura" }
          - { label: "LinkedIn (link)", name: "linkedin", widget: "string", default: "#" }

  # ── PROJETOS ──
  - name: "projetos"
    label: "Projetos"
    folder: "_projetos"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nome do Projeto", name: "title", widget: "string" }
      - label: "Categoria"
        name: "categoria"
        widget: "select"
        options:
          - { label: "Residencial", value: "residencial" }
          - { label: "Comercial",   value: "comercial"   }
          - { label: "Interiores",  value: "interiores"  }
          - { label: "Obras",       value: "obras"       }
          - { label: "Para Arquitetos / Designers", value: "arquitetos" }
      - { label: "Foto Principal",  name: "foto_principal", widget: "image" }
      - label: "Galeria de Fotos"
        name: "galeria"
        widget: "list"
        required: false
        field: { label: "Foto", name: "foto", widget: "image" }
      - { label: "Localização do Projeto", name: "localizacao", widget: "string", required: false }
      - { label: "Ano",                    name: "ano",         widget: "string", required: false }
      - { label: "Descrição (PT)",         name: "descricao_pt", widget: "text",  required: false }
      - { label: "Descrição (EN)",         name: "descricao_en", widget: "text",  required: false }
      - { label: "Destaque na Home",       name: "destaque",    widget: "boolean", default: false }
      - { label: "Projeto em Destaque (ocupa 2 colunas)", name: "featured", widget: "boolean", default: false }
      - { label: "Publicado",              name: "publicado",   widget: "boolean", default: true }
      - { label: "Ordem de exibição",      name: "ordem",       widget: "number",  default: 1 }

  # ── TEXTOS DA HOME ──
  - name: "textos"
    label: "Textos do Site"
    files:
      - label: "Home — Hero"
        name: "hero"
        file: "_data/hero.json"
        fields:
          - { label: "Eyebrow PT", name: "eyebrow_pt", widget: "string" }
          - { label: "Eyebrow EN", name: "eyebrow_en", widget: "string" }
          - { label: "Título PT",  name: "titulo_pt",  widget: "string" }
          - { label: "Título EN",  name: "titulo_en",  widget: "string" }
          - { label: "Subtítulo PT", name: "sub_pt",   widget: "text" }
          - { label: "Subtítulo EN", name: "sub_en",   widget: "text" }
          - { label: "Foto Hero (opcional)", name: "foto_hero", widget: "image", required: false }

      - label: "Sobre — Textos"
        name: "sobre"
        file: "_data/sobre.json"
        fields:
          - { label: "Parágrafo 1 PT", name: "p1_pt", widget: "text" }
          - { label: "Parágrafo 1 EN", name: "p1_en", widget: "text" }
          - { label: "Parágrafo 2 PT", name: "p2_pt", widget: "text" }
          - { label: "Parágrafo 2 EN", name: "p2_en", widget: "text" }
          - { label: "Foto de Perfil (opcional)", name: "foto_perfil", widget: "image", required: false }
